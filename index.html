<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>La réglementation</title>
<style>
:root { --orange:#ff6600; --noir:#222; --gris:#f7f7f8; --ok:#2e7d32; --ko:#c62828; }
*{box-sizing:border-box}
body { font-family: "Segoe UI", Tahoma, sans-serif; background: var(--gris); color: var(--noir); margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; }
.banner { background:var(--noir); color:#fff; padding:10px; border-radius:10px; text-align:center; font-weight:700; width:100%; max-width:920px; margin-bottom:15px; }
h1 { color:var(--orange); text-align:center; margin:8px 0; }
.section { background:#fff; padding:18px; border-radius:12px; box-shadow:0 3px 6px rgba(0,0,0,.07); width:100%; max-width:920px; margin:10px 0; }
input[type="text"], input[type="number"] { padding:10px 12px; border:1px solid #ccc; border-radius:8px; font-size:15px; }
input[type="number"]{ width:140px; }
button { background:var(--orange); color:#fff; border:none; padding:10px 16px; border-radius:8px; font-size:15px; cursor:pointer; }
button[disabled]{ opacity:.6; cursor:not-allowed; }
button:hover:not([disabled]){ filter:brightness(.97); }

/* Focus clavier visible pour accessibilite */
button:focus-visible,
input:focus-visible {
  outline: 3px solid #0f62fe;
  outline-offset: 2px;
}

.home-page { display:block; }
.home-content { text-align:center; }
.home-subtitle { color:var(--noir); margin-top:0; font-size:24px; }
.field-wrap { margin: 16px 0; }
.field-label { display:block; margin-bottom:8px; font-weight:600; }
.candidate-input { width:100%; max-width:400px; padding:12px; font-size:16px; }
.access-form { display:flex; flex-direction:column; align-items:center; }
.access-btn { margin-top: 4px; }
.welcome-text { margin: 8px 0 18px; font-size: 22px; font-weight: 700; color: var(--noir); }
.home-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.home-actions button { padding: 12px 32px; font-size:16px; }
.eligibility-message { min-height: 24px; margin-top: 12px; font-weight: 600; }
.training-btn { background:#3b82f6; }
.eval-btn { background:#2f855a; }
.status-message { min-height: 24px; margin-top: 14px; font-weight: 600; }
.ok { color: var(--ok); }
.err { color: var(--ko); }
[hidden] { display: none !important; }

.quiz-header { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.quiz-mode { font-weight:700; color:var(--orange); }
.quiz-progress { font-weight:600; }
.quiz-timer { font-weight:700; color:#b45309; }
.quiz-timer-warning { color:#b45309; }
.quiz-timer-danger { color:#c62828; animation: pulse-timer 0.9s infinite; }

@keyframes pulse-timer {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.quiz-card { border:1px solid #ddd; border-radius:10px; padding:16px; background:#fff; }
.quiz-question { font-size:20px; font-weight:700; margin:0 0 14px; text-align:center; }
.quiz-question,
.quiz-card {
  -webkit-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
.quiz-options { display:flex; flex-direction:column; gap:10px; margin: 6px 0 12px; justify-content:center; align-items:center; }
.quiz-option { display:flex; align-items:center; gap:8px; font-weight:600; }
.quiz-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; justify-content:center; }
.secondary-btn { background:#4b5563; }
.quiz-error { min-height:24px; font-weight:600; color:var(--ko); }
.result-box { text-align:center; }
.result-score { font-size:24px; font-weight:800; margin:8px 0; }
.result-send-status { min-height:24px; font-weight:600; margin-top:8px; }
</style>
</head>
<body>

<div id="bannerTitle" class="banner">Conduite en sécurité</div>

<!-- PAGE 1: ACCUEIL -->
<div id="page-accueil" class="section home-page">
  <h1 id="presentation-title">nom du qcm</h1>
  <div class="home-content">
    <div id="access-step">
      <form id="access-form" class="access-form">
        <div class="field-wrap">
          <label class="field-label" for="candidate">Taper votre nom pour commencer</label>
          <input type="text" id="candidate" class="candidate-input" placeholder="Nom de l'eleve" autocomplete="off" />
        </div>

        <button id="accessBtn" class="access-btn" type="submit">Continuer</button>
      </form>

      <div id="message" class="status-message" aria-live="polite"></div>
    </div>

    <div id="welcome-step" hidden>
      <div id="welcomeMessage" class="welcome-text"></div>

      <div class="home-actions">
        <button id="trainingBtn" class="training-btn" type="button">Révision</button>
        <button id="evalBtn" class="eval-btn" type="button" disabled>Evaluation</button>
      </div>

      <div id="eligibilityMessage" class="eligibility-message" aria-live="polite"></div>
    </div>
  </div>
</div>

<!-- PAGE 2: QUIZ -->
<div id="page-quiz" class="section" hidden>
  <div class="quiz-header">
    <div id="quizModeLabel" class="quiz-mode"></div>
    <div id="quizProgress" class="quiz-progress"></div>
    <div id="quizTimer" class="quiz-timer" hidden></div>
  </div>

  <div class="quiz-card">
    <p id="quizQuestion" class="quiz-question"></p>

    <form id="quizForm">
      <div class="quiz-options" role="radiogroup" aria-label="Reponse Vrai ou Faux">
        <label class="quiz-option" for="answerTrue">
          <input id="answerTrue" type="radio" name="quizAnswer" value="true" />
          VRAI
        </label>

        <label class="quiz-option" for="answerFalse">
          <input id="answerFalse" type="radio" name="quizAnswer" value="false" />
          FAUX
        </label>

        <label class="quiz-option" for="answerUnknown">
          <input id="answerUnknown" type="radio" name="quizAnswer" value="unknown" />
          Je ne sais pas
        </label>
      </div>

      <div id="quizError" class="quiz-error" aria-live="polite"></div>

      <div class="quiz-actions">
        <button id="nextQuestionBtn" type="submit">Valider et continuer</button>
        <button id="quitQuizBtn" class="secondary-btn" type="button">Quitter le quiz</button>
      </div>
    </form>
  </div>
</div>

<!-- PAGE 3: RESULTAT -->
<div id="page-resultat" class="section" hidden>
  <div class="result-box">
    <h1>Résultat</h1>
    <p id="resultMode"></p>
    <p id="resultScore" class="result-score"></p>
    <p id="resultDetails"></p>

    <div class="quiz-actions" style="justify-content:center;">

// Uniformise le nom pour fiabiliser les comparaisons (majuscules, espaces, accents).
function normaliserNom(nom) {
  return nom
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toUpperCase();
}

// Melange un tableau avec Fisher-Yates pour un ordre aleatoire.
function melangerTableau(items) {
  const clone = [...items];

  for (let i = clone.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [clone[i], clone[j]] = [clone[j], clone[i]];
  }

  return clone;
}

}

// Arrete le timer de question en cours s'il existe.
function arreterTimerQuestion() {
  if (quizState.questionTimerId) {
    clearInterval(quizState.questionTimerId);
    quizState.questionTimerId = null;
  }
}

// Met a jour l'affichage du compte a rebours sur le quiz.
function afficherTimerQuestion(secondesRestantes) {
  if (!quizTimer) {
    return;
  }

  if (quizState.mode !== "evaluation") {
    quizTimer.hidden = true;
    quizTimer.textContent = "";
    quizTimer.className = "quiz-timer";
    return;
  }

  quizTimer.hidden = false;
  quizTimer.textContent = `Temps restant: ${secondesRestantes} s`;

  if (secondesRestantes <= 5) {
    quizTimer.className = "quiz-timer quiz-timer-danger";
    return;
  }

  if (secondesRestantes <= 10) {
    quizTimer.className = "quiz-timer quiz-timer-warning";
    return;
  }

  quizTimer.className = "quiz-timer";
}

// Lance un timer de 15 secondes en mode evaluation.
function demarrerTimerQuestion() {
  arreterTimerQuestion();

  if (quizState.mode !== "evaluation") {
    afficherTimerQuestion(0);
    return;
  }

  quizState.questionDeadlineMs = Date.now() + (EVALUATION_TIMER_SECONDS * 1000);
  afficherTimerQuestion(EVALUATION_TIMER_SECONDS);

  quizState.questionTimerId = setInterval(() => {
    const msRestantes = quizState.questionDeadlineMs - Date.now();
    const secondesRestantes = Math.max(0, Math.ceil(msRestantes / 1000));
    afficherTimerQuestion(secondesRestantes);

    if (msRestantes <= 0) {
      arreterTimerQuestion();
      validerQuestion(true);
    }
  }, 200);
}

// Ajoute des protections UI pour limiter la copie des questions pendant le quiz.
function activerProtectionContenuQuiz() {
  pageQuiz.addEventListener("contextmenu", (event) => {
    event.preventDefault();
  });

  pageQuiz.addEventListener("copy", (event) => {
    event.preventDefault();
  });

  pageQuiz.addEventListener("cut", (event) => {
    event.preventDefault();
  });

  pageQuiz.addEventListener("dragstart", (event) => {
    event.preventDefault();
  });

  document.addEventListener("keydown", (event) => {
    if (pageQuiz.hidden) {
      return;
    }

    const key = event.key.toLowerCase();
    const isModifierPressed = event.ctrlKey || event.metaKey;

    if (isModifierPressed && (key === "c" || key === "x" || key === "a")) {
      event.preventDefault();
    }
  });
}

// Construit une cle localStorage unique (QCM + mode + eleve + theme).
function getThemePoolStorageKey(mode, themeId) {
  const nom = localStorage.getItem("eleveNom") || "ANONYME";
  return `qcm-pool:${document.title}:${mode}:${nom}:theme-${themeId}`;
}

// Lit le pool restant d'un theme; retombe sur un pool melange si besoin.
function lirePoolThemeQuestions(mode, themeId, allQuestionIds) {
  const storageKey = getThemePoolStorageKey(mode, themeId);
  const raw = localStorage.getItem(storageKey);

  if (!raw) {
    return melangerTableau(allQuestionIds);
  }

  try {
    const parsed = JSON.parse(raw);

    if (!Array.isArray(parsed)) {
      return melangerTableau(allQuestionIds);
    }

    const idSet = new Set(allQuestionIds);
    const nettoye = parsed.filter((id) => idSet.has(id));

    if (nettoye.length === 0) {
      return melangerTableau(allQuestionIds);
    }

    return nettoye;
  } catch (error) {
    console.error(error);
    return melangerTableau(allQuestionIds);
  }
}

// Sauvegarde la liste des questions restantes pour un theme donne.
function ecrirePoolThemeQuestions(mode, themeId, remainingIds) {
  const storageKey = getThemePoolStorageKey(mode, themeId);
  localStorage.setItem(storageKey, JSON.stringify(remainingIds));
}

// Tire une seule question dans un theme en respectant l'epuisement.
function tirerUneQuestionParTheme(mode, themeId, themeQuestions) {
  const questionById = new Map(themeQuestions.map((q) => [q.id, q]));
  const allQuestionIds = themeQuestions.map((q) => q.id);
  let remainingIds = lirePoolThemeQuestions(mode, themeId, allQuestionIds);

  if (remainingIds.length === 0) {
    remainingIds = melangerTableau(allQuestionIds);
  }

  const nextId = remainingIds.shift();
  ecrirePoolThemeQuestions(mode, themeId, remainingIds);
  return questionById.get(nextId);
}

// Construit le quiz: 1 question par theme puis melange final.
function creerSelectionQuestions(mode) {
  if (QUESTION_BANK.length === 0) {
    throw new Error("Base de questions vide.");
  }

  if (TOTAL_QUESTIONS !== THEMES.length) {
    throw new Error(`Configuration invalide: totalQuestions=${TOTAL_QUESTIONS}, themes=${THEMES.length}.`);
  }

  const selection = [];

  for (const theme of THEMES) {
    const questionsDuTheme = QUESTION_BANK.filter((q) => q.themeId === theme.id);

    if (questionsDuTheme.length === 0) {
      throw new Error(`Aucune question affectée au thème ${theme.id}.`);
    }

    const question = tirerUneQuestionParTheme(mode, theme.id, questionsDuTheme);

    if (!question) {
      throw new Error(`Impossible de tirer une question pour le thème ${theme.id}.`);
    }

    selection.push(question);
  }

  return melangerTableau(selection);
}

// Reinitialise les choix de reponse avant d'afficher la question suivante.
function reinitialiserReponse() {
  answerTrue.checked = false;
  answerFalse.checked = false;
  answerUnknown.checked = false;
  quizError.textContent = "";
}

// Met a jour l'interface avec la question courante et la progression.
function afficherQuestionCourante() {
  const current = quizState.questions[quizState.index];
  const numero = quizState.index + 1;
  const estDerniereQuestion = numero === quizState.questions.length;
  quizState.questionResolved = false;

  quizProgress.textContent = `Question ${numero}/${quizState.questions.length}`;
  quizQuestion.textContent = current.text;
  nextQuestionBtn.textContent = estDerniereQuestion ? "Valider et terminer" : "Valider et continuer";
  reinitialiserReponse();
  demarrerTimerQuestion();
}

// Initialise un nouveau quiz pour le mode revision ou evaluation.
function demarrerQuiz(mode) {
  try {
    quizState = {
      mode,
      questions: creerSelectionQuestions(mode),
      index: 0,
      score: 0,
      reponsesDetaillees: [],
      startedAtMs: Date.now(),
      finishedAtMs: 0,
      resultSendAttempted: false,
      questionTimerId: null,
      questionDeadlineMs: 0,
      questionResolved: false
    };

    quizModeLabel.textContent = mode === "revision"
      ? `Mode Révision - ${document.title}`
      : `Mode Évaluation - ${document.title}`;
    afficherPage("quiz");
    afficherQuestionCourante();
  } catch (error) {
    setEligibilityMessage("Impossible de lancer le quiz: base de questions insuffisante.", "err");
    console.error(error);
  }
}

// Termine la session, affiche le score puis lance l'envoi du resultat.
function terminerQuiz() {
  const modeLabel = quizState.mode === "revision" ? "Révision" : "Évaluation";
  arreterTimerQuestion();
  afficherTimerQuestion(0);
  quizState.finishedAtMs = Date.now();
  const dureeSecondes = Math.max(0, Math.round((quizState.finishedAtMs - quizState.startedAtMs) / 1000));
  const dureeTexte = formaterDuree(dureeSecondes);

  resultMode.textContent = `Mode: ${modeLabel}`;
  resultScore.textContent = `${quizState.score} / ${quizState.questions.length}`;
  resultDetails.textContent = `Temps de réalisation : ${dureeTexte}`;
  restartQuizBtn.disabled = true;
  setResultSendStatus("Envoi du résultat en cours...", "");
  afficherPage("resultat");
  envoyerResultatQuiz();
}

// Affiche l'etat d'envoi du resultat (en cours, succes, echec).
function setResultSendStatus(texte, type) {
  resultSendStatus.textContent = texte;
  resultSendStatus.className = `result-send-status ${type}`.trim();
}

// Convertit une valeur booleenne/unknown en libelle lisible.
function libelleReponse(value) {
  if (value === true) {
    return "VRAI";
  }

  if (value === false) {
    return "FAUX";
  }

  return "JE NE SAIS PAS";
}

// Formate la reponse eleve avec indicateur de justesse.
function libelleReponseEleveAvecStatut(reponseEleve, bonneReponse) {
  if (reponseEleve === "unknown") {
    return libelleReponse(reponseEleve);
  }

  const isCorrect = reponseEleve === bonneReponse;
  return `${libelleReponse(reponseEleve)} ${isCorrect ? "✔️" : "❌"}`;
}

// Formate la date au format jour/mois/annee heure:minute:seconde.
function formaterDateResultat(date) {
  const pad = (n) => String(n).padStart(2, "0");
  const jour = pad(date.getDate());
  const mois = pad(date.getMonth() + 1);
  const annee = date.getFullYear();
  const heures = pad(date.getHours());
  const minutes = pad(date.getMinutes());
  const secondes = pad(date.getSeconds());

  return `${jour}/${mois}/${annee} ${heures}:${minutes}:${secondes}`;
}

// Formate une duree en secondes vers un texte lisible.
function formaterDuree(secondes) {
  const total = Math.max(0, Number(secondes) || 0);
  const minutes = Math.floor(total / 60);
  const resteSecondes = total % 60;
  return `${minutes} min ${resteSecondes} s`;
}

// Envoie le resultat au backend sans second envoi automatique pour eviter les doublons.
async function envoyerResultatQuiz() {
  if (quizState.resultSendAttempted) {
    return;
  }

  quizState.resultSendAttempted = true;

  const nom = localStorage.getItem("eleveNom") || "";
  const mode = quizState.mode;
  const score = quizState.score;
  const bareme = quizState.questions.length;
  const dureeSecondes = Math.max(0, Math.round((quizState.finishedAtMs - quizState.startedAtMs) / 1000));
  const dureeTexte = formaterDuree(dureeSecondes);
  const dateIso = formaterDateResultat(new Date());
  const details = quizState.reponsesDetaillees;
  const questions = details.map((item) => item.question).join("\n");
  const bonnesReponses = details.map((item) => item.bonneReponse).join("\n");
  const reponsesEleve = details.map((item) => item.reponseEleve).join("\n");
  const ongletResultats = mode === "revision"
    ? SETTINGS.appScript.revisionResultsSheetName
    : SETTINGS.appScript.evaluationResultsSheetName;

  const params = new URLSearchParams({
    action: "enregistrer-resultat",
    nom,
    score: `${score}/${bareme}`,
    note: String(score),
    dureeSecondes: String(dureeSecondes),
    dureeTexte,
    dateIso,
    nombreQuestions: String(bareme),
    questions,
    bonnesReponses,
    reponsesEleve,
    ongletResultats,
    ongletResultatsCible: ongletResultats,
    ongletRevisionResultats: SETTINGS.appScript.revisionResultsSheetName,
    ongletEvaluationResultats: SETTINGS.appScript.evaluationResultsSheetName
  });

  // Envoi detaille indexe pour compatibilite avec les scripts qui attendent Q1..Qn.
  for (let i = 0; i < bareme; i++) {
    const detail = details[i] || {};
    const index = String(i + 1);
    params.append(`Q${index}`, detail.question || "");
    params.append(`BR${index}`, detail.bonneReponse || "");
    params.append(`RE${index}`, detail.reponseEleve || "");
  }

  try {
    const response = await fetch(RESULTS_WEB_APP_URL, {
      method: "POST",
      mode: "cors",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
      },
      body: params.toString()
    });

    if (!response.ok) {
      throw new Error("Reponse serveur invalide pour l'enregistrement");
    }

    restartQuizBtn.disabled = false;
    setResultSendStatus("Résultat envoyé avec succès.", "ok");
    return;
  } catch (error) {
    restartQuizBtn.disabled = false;
    setResultSendStatus("Confirmation impossible. Le résultat a peut-être déjà été enregistré. Aucun renvoi automatique n'est fait pour éviter les doublons.", "err");
    console.error(error);
  }
}

// Lit le choix courant de l'eleve (true, false, unknown ou null).
function lireReponseSelectionnee() {
  if (answerTrue.checked) {
    return true;
  }

  if (answerFalse.checked) {
    return false;
  }

  if (answerUnknown.checked) {
    return "unknown";
  }

  return null;
}

// Valide la reponse, calcule le score et passe a la suite.
function validerQuestion(forcerInconnu = false) {
  if (quizState.questionResolved) {
    return;
  }

  let reponse = forcerInconnu ? "unknown" : lireReponseSelectionnee();

  if (reponse === null) {
    quizError.textContent = "Vous devez choisir VRAI, FAUX ou Je ne sais pas avant de continuer.";
    return;
  }

  quizState.questionResolved = true;
  arreterTimerQuestion();

  const current = quizState.questions[quizState.index];

  quizState.reponsesDetaillees.push({
    question: current.text,
    bonneReponse: libelleReponse(current.answer),
    reponseEleve: libelleReponseEleveAvecStatut(reponse, current.answer)
  });

  if (reponse === "unknown") {
    quizState.score += 0;
  } else if (reponse === current.answer) {
    quizState.score += 1;
  } else {
    quizState.score -= 1;
  }

  quizState.index += 1;

  if (quizState.index >= quizState.questions.length) {
    terminerQuiz();
    return;
  }

  afficherQuestionCourante();
}

// Revient a l'accueil sans perdre l'etape de bienvenue.
function quitterQuiz() {
  arreterTimerQuestion();
  afficherTimerQuestion(0);
  afficherPage("accueil");
  welcomeStep.hidden = false;
  setEligibilityMessage("", "");
}

// Recupere la premiere valeur numerique valide parmi plusieurs cles.
function lireNombre(data, keys) {
  for (const key of keys) {
    const value = data[key];

    if (typeof value === "number" && Number.isFinite(value)) {
      return value;
    }
  }

  return 0;
}

// Normalise la reponse backend vers un format simple d'eligibilite.
function extraireEligibilite(data) {
  const isEligible = data.eligible === true || data.authorizedForEvaluation === true;
  const successCount = lireNombre(data, [
    "successfulRevisionCount",
    "eligibleRevisionCount",
    "revisionCount",
    "count"
  ]);

  return { isEligible, successCount };
}

// Interroge le backend pour savoir si l'evaluation est accessible.
async function verifierEligibiliteEvaluation(nom) {
  const params = new URLSearchParams({
    action: "eligibilite-evaluation",
    nom,
    seuilReussites: String(REQUIRED_REVISION_SUCCESS),
    seuilNote: String(MIN_REVISION_SCORE),
    bareme: String(TOTAL_QUESTIONS),
    sourceEligibilite: "revision",
    ongletRevision: SETTINGS.appScript.revisionResultsSheetName,
    ongletRevisionResultats: SETTINGS.appScript.revisionResultsSheetName,
    ongletAutorisations: SETTINGS.appScript.authorizationsSheetName
  });
  const response = await fetch(`${RESULTS_WEB_APP_URL}?${params.toString()}`, { method: "GET", mode: "cors" });

  if (!response.ok) {
    throw new Error("Reponse serveur invalide pour l'evaluation");
  }

  const data = await response.json();
  return extraireEligibilite(data || {});
}

// Affiche l'ecran d'accueil personnalise apres autorisation validee.
async function afficherBienvenue(nomAffiche, nomNormalise) {
  accessStep.hidden = true;
  welcomeStep.hidden = false;
  welcomeMessage.textContent = `Bienvenue ${nomAffiche}`;
  localStorage.setItem("eleveNom", nomNormalise);
  localStorage.setItem("eleveNomAffiche", nomAffiche);
  setMessage("", "");
  setEvaluationEnabled(true);
  setEligibilityMessage("La vérification de l'accès à l'évaluation se fait au clic sur le bouton Évaluation.", "");
}

// Controle l'eligibilite au moment du clic sur le bouton Evaluation.
async function verifierEvaluationAuClic() {
  const nomNormalise = localStorage.getItem("eleveNom") || normaliserNom(inputNom.value || "");

  if (!nomNormalise) {
    setEligibilityMessage("Veuillez d'abord saisir votre nom pour accéder au quiz.", "err");
    return;
  }

  evalBtn.disabled = true;
  setEligibilityMessage("Vérification de l'accès au QCM d'évaluation en cours...", "");

  try {
    const eligibility = await verifierEligibiliteEvaluation(nomNormalise);

    if (!eligibility.isEligible) {
      setEligibilityMessage(
        `Le QCM d'évaluation sera disponible après ${REQUIRED_REVISION_SUCCESS} révisions réussies avec au moins ${MIN_REVISION_SCORE}/${TOTAL_QUESTIONS}. Résultat actuel : ${eligibility.successCount}/${REQUIRED_REVISION_SUCCESS}.`,
        "err"
      );
      return;
    }

    setEligibilityMessage("QCM d'évaluation disponible.", "ok");
    ouvrirQcm("evaluation");
  } catch (error) {
    setEligibilityMessage("Impossible de vérifier l'accès au QCM d'évaluation pour le moment.", "err");
    console.error(error);
  } finally {
    evalBtn.disabled = false;
  }
}

// Verifie dans la source autorisations si le nom est autorise.
async function verifierNomAutorise(nom) {
  const params = new URLSearchParams({
    action: "verifier-autorisation",
    nom,
    ongletAutorisations: SETTINGS.appScript.authorizationsSheetName
  });
  const url = `${AUTH_WEB_APP_URL}?${params.toString()}`;
  const response = await fetch(url, { method: "GET", mode: "cors" });

  if (!response.ok) {
    throw new Error("Reponse serveur invalide");
  }

  const data = await response.json();
  return data && data.authorized === true;
}

// Orchestration du controle d'acces depuis le formulaire d'accueil.
async function controlerAcces() {
  const nomAffiche = inputNom.value.replace(/\s+/g, " ").trim();
  const nomSaisi = normaliserNom(nomAffiche);

  if (!nomSaisi) {
    setMessage("Veuillez saisir votre nom.", "err");
    inputNom.focus();
    return;
  }

  setButtonsDisabled(true);
  setMessage("Verification en cours...", "");

  try {
    const isAutorise = await verifierNomAutorise(nomSaisi);

    if (!isAutorise) {
      setMessage("Accès refusé", "err");
      return;
    }

    await afficherBienvenue(nomAffiche, nomSaisi);
  } catch (error) {
    setMessage("Erreur de vérification. Réessayez.", "err");
    console.error(error);
  } finally {
    setButtonsDisabled(false);
  }
}

// Memorise le mode choisi puis ouvre le QCM correspondant.
function ouvrirQcm(mode) {
  localStorage.setItem("modeSelectionne", mode);
  demarrerQuiz(mode);
}

accessForm.addEventListener("submit", (event) => {
  event.preventDefault();
  controlerAcces();
});

trainingBtn.addEventListener("click", () => {
  ouvrirQcm("revision");
});

evalBtn.addEventListener("click", () => {
  verifierEvaluationAuClic();
});

quizForm.addEventListener("submit", (event) => {
  event.preventDefault();
  validerQuestion();
});

quitQuizBtn.addEventListener("click", () => {
  quitterQuiz();
});

restartQuizBtn.addEventListener("click", () => {
  quitterQuiz();
});

activerProtectionContenuQuiz();
</script>
